[project]
name = "contexta-lab-idp-api"
version = "0.1.0"
description = "Lab report extraction service for Contexta EMR"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",
    "pyjwt>=2.9",
    "pdfplumber>=0.11",    # MIT. app/services/ocr/textlayer.py
    "dateparser>=1.2",     # day-first Indian dates - app/services/ocr/dates.py
    "rapidfuzz>=3.14",     # near-miss label matching - app/services/ocr/synonyms.py
]

[project.optional-dependencies]
# ruff is pinned exactly: ../ruff.toml sets required-version, and a floor here
# would install a release that the config then refuses to run under.
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff==0.16.10",
    "mypy>=1.13",
    "types-requests",
    "types-dateparser",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# Lint and format configuration lives in ../ruff.toml, so one file governs this
# package, its tests, scripts/ and db/seed/ alike.

[tool.mypy]
python_version = "3.11"                  # the floor this package declares, not the image's 3.12
packages = ["app"]
check_untyped_defs = true                # a body without annotations is still checked
disallow_untyped_defs = true             # every function says what it takes and returns
disallow_incomplete_defs = true
no_implicit_optional = true
strict_equality = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

# PaddleOCR-VL is the optional in-boundary engine. It is not installed in this
# image and never imported at runtime here; app/services/ocr/paddle_vl.py
# imports it lazily for the machine that has it.
[[tool.mypy.overrides]]
module = ["paddleocr", "paddleocr.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# The analyte seed and the panel templates are read at runtime and must travel
# with the package, not just exist in the checkout.
[tool.setuptools.package-data]
"app.services.ocr" = ["data/*.sql", "templates/*.json"]
