[project]
name = "contexta-lab-idp-api"
version = "0.1.0"
description = "Lab report extraction service for Contexta EMR"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",
    "pyjwt>=2.9",
    "pymupdf>=1.24",       # see CLAUDE.md section 8: AGPL-3.0, open question
    "pdfplumber>=0.11",    # MIT. app/services/ocr/textlayer.py
    "dateparser>=1.2",     # day-first Indian dates - app/services/ocr/dates.py
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
