# Local development stack: database, API, console.
#
#   docker compose up --build
#
# The database here is a LOCAL Postgres, not Neon. That is deliberate for
# development: no autosuspend, no network round trip, and no chance of a test
# run writing to the shared instance. Point DATABASE_URL at Neon when you want
# the hosted one.
#
# After the stack is up, once:
#   docker compose exec api python /work/scripts/run_migrations.py
#   docker compose exec api python /work/scripts/load_corpus.py

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: labidp
      POSTGRES_PASSWORD: labidp_local_only
      POSTGRES_DB: labidp
    ports:
      # 15432, not 5433. A local PostgreSQL 17 runs on 5432 here, and 5433 sat close
      # enough to it that a pgAdmin entry pointed at one while its saved password
      # belonged to the other - which reads as "password authentication failed" and
      # sends you looking at the database instead of the client.
      - "15432:5432"
    volumes:
      - labidp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labidp -d labidp"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Browse the database in a browser. Opt-in, so a plain `docker compose up`
  # does not pay for it:
  #
  #   docker compose up -d pgadmin      ->  http://localhost:5050
  #
  # The server is pre-registered from db/pgadmin-servers.json, so there is
  # nothing to configure on first open. Two things about that file are the
  # usual stumbling blocks:
  #
  #   Host is `db`, the compose service name, NOT localhost. Compose puts
  #   every service on one network and registers them in DNS by name, and
  #   inside this container localhost is pgAdmin itself.
  #
  #   Port is 5432, the port INSIDE that network - not the 5433 the host uses.
  #   5433 only exists because the host port was moved to avoid colliding
  #   with a local Postgres.
  #
  # SERVER_MODE False runs it single-user so there is no pgAdmin login to get
  # past. Fine for a local development database whose password is in this
  # file; not something to copy to anything shared.
  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ["tools"]
    environment:
      # Not a .local address: pgAdmin validates this and rejects reserved
      # TLDs. example.com is the RFC 2606 placeholder and always passes.
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: labidp_local_only
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      # Named, so registered servers and saved passwords survive a recreate.
      - labidp_pgadmin:/var/lib/pgadmin
      - ./db/pgadmin-servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./api
    environment:
      DATABASE_URL: postgresql://labidp:labidp_local_only@db:5432/labidp
      JWT_SECRET: local-development-only-do-not-ship
      STORAGE_DIR: /work/storage
      CORS_ORIGINS: http://localhost:3000
      ENVIRONMENT: development
    volumes:
      - ./api:/app
      - ./scripts:/work/scripts:ro
      - ./db:/work/db:ro
      - ./corpus:/work/corpus:ro
      # The dumps the worker writes. api scores them because api is the side
      # that holds the answer key; the worker holds the API key and must never
      # see the answers (CLAUDE.md section 7).
      - ./bench/results:/work/bench/results
      # Bind-mounted, not a named volume: scripts/ocr_worker.py runs on the
      # host (the api image has no requests and no API key on purpose) and
      # has to read the same uploaded files the service wrote.
      - ./storage:/work/storage
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Reads whatever is waiting. Without it an upload sits in 'received'
  # forever, which looks exactly like extraction failing - a document showing
  # "0 rows read" that had simply never been sent anywhere.
  #
  # Separate from api because it is the only thing that talks to OpenParser:
  # the service answering the browser has no API key and no HTTP client, so a
  # compromise there cannot reach a third party or spend money.
  #
  # IDP_OPENPARSER_KEY comes from .env, which is gitignored. Documents read
  # here are uploaded to api.openparser.dev in the United States - permitted
  # for this service by Karthik's decision of 2026-09-21, CLAUDE.md section 2.
  worker:
    build:
      context: ./api
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgresql://labidp:labidp_local_only@db:5432/labidp
      STORAGE_DIR: /work/storage
      RESULTS_DIR: /work/bench/results
      IDP_OPENPARSER_KEY: ${IDP_OPENPARSER_KEY:-}
    volumes:
      - ./scripts:/work/scripts:ro
      - ./storage:/work/storage
      # Writable, unlike scripts: one <pdf name>.json per document lands here.
      - ./bench/results:/work/bench/results
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - api
    command: npm run dev

volumes:
  labidp_pgdata:
  labidp_pgadmin:
